<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){var t=localStorage.getItem('sne-vault-theme');document.documentElement.setAttribute('data-theme',t||'dark')})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsiveness.css">
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body class="auth-page">

    <header>
        <a class="logo" href="index.html"><img src="logo.jpg" alt="SNE VAULT logo"><span>SNE <b>VAULT</b></span></a>
    </header>

    <div class="form-container">
        <form class="auth-form" id="forgot-password-form">
            <div class="auth-brand">
                <img src="logo.jpg" alt="SNE VAULT logo">
                <span>Secure account access</span>
            </div>

            <a class="log-home" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to home</a>

            <h2>Forgot Password?</h2>
            <p class="auth-intro">Enter the email connected to your account and we'll send you a reset link to get back in.</p>

            <label for="forgot-email">Email address</label>
            <input id="forgot-email" type="email" placeholder="you@example.com" autocomplete="email" required>

            <button type="submit"><i class="bi bi-envelope-arrow-up" aria-hidden="true"></i> Send reset link</button>

            <p class="auth-switch">
                <span>Remember your password?</span>
                <a href="login.html">Sign in</a>
            </p>

            <p id="forgot-message" class="auth-message" role="status" aria-live="polite"></p>
        </form>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js';

        const form = document.getElementById('forgot-password-form');
        const emailInput = document.getElementById('forgot-email');
        const message = document.getElementById('forgot-message');

        const setMessage = (text, type = 'info') => {
            message.textContent = text;
            message.classList.remove('success', 'error');

            if (type === 'success') {
                message.classList.add('success');
            }

            if (type === 'error') {
                message.classList.add('error');
            }
        };

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                setMessage('Please enter your email address.', 'error');
                return;
            }

            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: `${window.location.origin}/reset-password.html`
                });

                if (error) {
                    setMessage(error.message, 'error');
                    return;
                }

                setMessage('Password reset link sent. Please check your email.', 'success');
                form.reset();
            } catch (error) {
                setMessage(error.message || 'Something went wrong. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
