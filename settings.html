<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){var t=localStorage.getItem('sne-vault-theme');document.documentElement.setAttribute('data-theme',t||'dark')})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | SNE VAULT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsiveness.css">
    <link rel="icon" href="logo.jpg" type="image/jpeg">
</head>
<body class="settings-page">
    <header class="legal-header">
        <a class="logo" href="index.html"><img src="logo.jpg" alt="SNE VAULT logo"><span>SNE <b>VAULT</b></span></a>
        <nav aria-label="Settings navigation">
            <a href="dashboard.html"><i class="bi bi-grid-1x2" aria-hidden="true"></i> Dashboard</a>
            <a href="contact.html"><i class="bi bi-headset" aria-hidden="true"></i> Support</a>
        </nav>
    </header>

    <main class="settings-content">
        <div class="page-navigation">
            <a class="legal-back-link" href="dashboard.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Dashboard</a>
        </div>
        <div class="settings-heading-row">
            <div>
                <p class="eyebrow">ACCOUNT PREFERENCES</p>
                <h1>Settings</h1>
                <p class="settings-intro">Manage your account security and preferences.</p>
            </div>
        </div>

        <div class="settings-grid">
            <section class="settings-card">
                <div class="settings-card-heading"><span class="settings-icon"><i class="bi bi-shield-lock" aria-hidden="true"></i></span><h2>Security</h2></div>
                <a class="settings-row" href="#change-password"><span><strong>Change Password</strong><small>Keep your account protected</small></span><i class="bi bi-chevron-right" aria-hidden="true"></i></a>
            </section>

            <section class="settings-card settings-danger-card">
                <div class="settings-card-heading"><span class="settings-icon"><i class="bi bi-person-x" aria-hidden="true"></i></span><h2>Account Management</h2></div>
                <button class="settings-danger-row" type="button"><i class="bi bi-trash3" aria-hidden="true"></i> <span>Delete Account</span></button>
            </section>

            <section class="settings-card settings-danger-card">
                <div class="settings-card-heading"><span class="settings-icon"><i class="bi bi-box-arrow-left" aria-hidden="true"></i></span><h2>Session</h2></div>
                <a class="settings-row" href="index.html"><span><strong>Log out</strong><small>Sign out of your account</small></span><i class="bi bi-box-arrow-right" aria-hidden="true"></i></a>
            </section>
        </div>
    </main>

    <script type="module">
        import { supabase } from './js/supabase.js';

        const { data: { session } } = await supabase.auth.getSession();

        if (!session) {
            window.location.href = 'login.html';
        }
    </script>

    <script type="module" src="js/tawk.js"></script>
</body>
</html>
