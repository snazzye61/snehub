<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){var t=localStorage.getItem('sne-vault-theme');document.documentElement.setAttribute('data-theme',t||'dark')})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsiveness.css">
     <link rel="icon" href="logo.png" type="image/png">
</head>
<body class="auth-page">

    
<header>
    <a class="logo" href="index.html"><img src="logo.jpg" alt="SNE VAULT logo"><span>SNE <b>VAULT</b></span></a>
    <select class="lang-select" id="lang-select" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option></select>
    <button class="header-theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode"><i class="bi bi-moon-stars" aria-hidden="true"></i><span class="theme-label">Dark</span></button>
</header>


<div class="form-container">
    <form class="auth-form">
        <div class="auth-brand">
            <img src="logo.jpg" alt="SNE VAULT logo">
            <span>Secure account access</span>
        </div>

        <a class="log-home" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to home</a>

        <h2 data-i18n="login-heading">Login</h2>
        <p class="auth-intro" data-i18n="login-intro">Sign in to manage your marketplace account.</p>

        <label for="login-email" data-i18n="login-email-label">Email address</label>
        <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" required>
        <label for="login-password" data-i18n="login-password-label">Password</label>
        <input id="login-password" type="password" placeholder="Enter your password" autocomplete="current-password" required>

        <button type="submit" data-i18n="login-submit-btn"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Sign in</button>

        <p class="auth-switch">
            <span data-i18n="login-switch-text">Don't have an account?</span>
            <a href="register.html" data-i18n="login-switch-link">Create one</a>
        </p>

    </form>

</div>
<script src="i18n.js"></script>
</body>
</html>
