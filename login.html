<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsiveness.css">
     <link rel="icon" href="logo.png" type="image/png">
</head>
<body class="auth-page">

    
<header>
    <div class="logo">SNE VAULT</div>
</header>


<div class="form-container">
    <form class="auth-form">
        <div class="auth-brand">
            <img src="logo.jpg" alt="SNE VAULT logo">
            <span>Secure account access</span>
        </div>

        <a class="log-home" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to home</a>

        <h2>Login</h2>
        <p class="auth-intro">Sign in to manage your marketplace account.</p>

        <label for="login-email">Email address</label>
        <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" required>
        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="Enter your password" autocomplete="current-password" required>

        <button type="submit"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Sign in</button>

        <p class="auth-switch">
            Don't have an account?
            <a href="register.html">Create one</a>
        </p>

    </form>

</div>

    <a class="whatsapp-float" href="https://wa.me/237652717609?text=Hello%20SNE%20VAULT%20support%2C%20I%20need%20help%20signing%20in." target="_blank" rel="noopener" aria-label="Contact WhatsApp support">
        <span class="whatsapp-icon"><i class="bi bi-whatsapp" aria-hidden="true"></i></span>
        <span class="whatsapp-label">Need help? Chat with us</span>
    </a>
</body>
</html>
