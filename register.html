<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsiveness.css">
    <link rel="icon" href="logo.png" type="image/png"> 
</head>
<body class="auth-page">

    
<header>
    <div class="logo">SNE VAULT</div>
</header>


<div class="form-container">

    <form class="auth-form">
        <div class="auth-brand">
            <img src="logo.jpg" alt="SNE VAULT logo">
            <span>Secure account access</span>
        </div>

        <a class="home_btn" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to home</a>

        <h2>Create Account</h2>
        <p class="auth-intro">Create your account to browse and manage purchases.</p>

        <label for="register-username">Username</label>
        <input id="register-username" type="text" placeholder="Choose a username" autocomplete="username" required>
        <label for="register-email">Email address</label>
        <input id="register-email" type="email" placeholder="you@example.com" autocomplete="email" required>
        <label for="register-password">Password</label>
        <input id="register-password" type="password" placeholder="Create a password" autocomplete="new-password" required>
        <label for="register-password-confirm">Confirm password</label>
        <input id="register-password-confirm" type="password" placeholder="Enter your password again" autocomplete="new-password" required>

        <button type="submit"><i class="bi bi-person-plus" aria-hidden="true"></i> Create account</button>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html" class="login-auth">Sign in</a>
        </p>

    </form>

</div>

    <a class="whatsapp-float" href="https://wa.me/237652717609?text=Hello%20SNE%20VAULT%20support%2C%20I%20need%20help%20creating%20an%20account." target="_blank" rel="noopener" aria-label="Contact WhatsApp support">
        <span class="whatsapp-icon"><i class="bi bi-whatsapp" aria-hidden="true"></i></span>
        <span class="whatsapp-label">Need help? Chat with us</span>
    </a>
</body>
</html>
