<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){var t=localStorage.getItem('sne-vault-theme');document.documentElement.setAttribute('data-theme',t||'dark')})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsiveness.css">
    <link rel="icon" href="logo.png" type="image/png"> 
</head>
<body class="auth-page">

    
<header>
    <a class="logo" href="index.html"><img src="logo.jpg" alt="SNE VAULT logo"><span>SNE <b>VAULT</b></span></a>
    <select class="lang-select" id="lang-select" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option></select>
    <button class="header-theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode"><i class="bi bi-moon-stars" aria-hidden="true"></i><span class="theme-label">Dark</span></button>
</header>


<div class="form-container">

    <form class="auth-form">
        <div class="auth-brand">
            <img src="logo.jpg" alt="SNE VAULT logo">
            <span>Secure account access</span>
        </div>

        <a class="home_btn" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to home</a>

        <h2 data-i18n="register-heading">Create Account</h2>
        <p class="auth-intro" data-i18n="register-intro">Create your account to browse and manage purchases.</p>

        <label for="register-username" data-i18n="register-username-label">Username</label>
        <input id="register-username" type="text" placeholder="Choose a username" autocomplete="username" required>
        <label for="register-email" data-i18n="register-email-label">Email address</label>
        <input id="register-email" type="email" placeholder="you@example.com" autocomplete="email" required>
        <label for="register-password" data-i18n="register-password-label">Password</label>
        <input id="register-password" type="password" placeholder="Create a password" autocomplete="new-password" required>
        <label for="register-password-confirm" data-i18n="register-confirm-label">Confirm password</label>
        <input id="register-password-confirm" type="password" placeholder="Enter your password again" autocomplete="new-password" required>

        <button type="submit" data-i18n="register-submit-btn"><i class="bi bi-person-plus" aria-hidden="true"></i> Create account</button>

        <p class="auth-switch">
            <span data-i18n="register-switch-text">Already have an account?</span>
            <a href="login.html" class="login-auth" data-i18n="register-switch-link">Sign in</a>
        </p>

    </form>

</div>
<script src="i18n.js"></script>
</body>
</html>
